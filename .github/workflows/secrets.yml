name: Secrets

# Blocks a commit that adds a credential. Scans only the commits this PR or
# push adds — keys committed before this check existed live on in history and
# are dealt with by rotating them. Rules and allowlists: .gitleaks.toml.
#
# Flagged a line you have checked is not a secret? End it with a
# `gitleaks:allow` comment. Flagged a real one? Remove it, rotate it, and
# rewrite the branch so the key is not left in the PR's history.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      # The gitleaks GitHub Action needs a paid license on organization repos,
      # so this runs the pinned release binary and verifies its checksum.
      - name: Install gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          sudo tar xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Self-test the rules
        run: bash test/secret-scan-selftest.sh

      - name: Scan the commits this change adds
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            RANGE="$HEAD~1..$HEAD"   # new branch or force-push: the tip commit only
          else
            RANGE="$BASE..$HEAD"
          fi
          echo "scanning $RANGE ($(git rev-list --count "$RANGE") commits)"
          gitleaks git . --config .gitleaks.toml --log-opts="$RANGE" \
            --redact --no-banner --verbose
